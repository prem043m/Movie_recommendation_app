<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina — Movie Discovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --obsidian: #050505; --graphite: #1A1A1A; --amethyst: #9D50BB; --cyan: #6E7DFF; --text-primary: #FFFFFF; --text-secondary: #A0A0A0; --accent-gradient: linear-gradient(135deg, var(--amethyst), var(--cyan)); --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--obsidian); color: var(--text-primary); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; }
        img, iframe { max-width: 100%; height: auto; display: block; }
        .ambient-bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% -20%, rgba(157,80,187,0.15) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(110,125,255,0.1) 0%, transparent 50%); filter: blur(80px); }
        nav { position: fixed; top: 0; width: 100%; padding: 1.5rem 4rem; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: linear-gradient(to bottom, rgba(5,5,5,0.8), transparent); backdrop-filter: blur(10px); }
        .logo { font-size: 1.8rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; align-items: center; }
        .nav-link { color: var(--text-secondary); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: 0.25s ease; }
        .nav-link:hover, .nav-link.is-active { color: var(--text-primary); border-bottom: 2px solid var(--cyan); }
        .health-banner { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 200; padding: 12px 20px; background: rgba(127,29,29,0.82); border-radius: 999px; border: 1px solid rgba(255,255,255,0.1); color: #fecaca; font-size: 0.9rem; font-weight: 700; display: none; }
        .hero { height: 90vh; display: flex; flex-direction: column; justify-content: center; padding: 0 4rem; position: relative; overflow: hidden; }
        .hero-content { max-width: 600px; z-index: 1; }
        .hero-eyebrow { text-transform: uppercase; letter-spacing: 3px; font-size: 0.8rem; color: var(--cyan); margin-bottom: 1rem; font-weight: 600; }
        .hero-title { font-size: 5rem; line-height: 1; margin-bottom: 1.5rem; letter-spacing: -2px; }
        .hero-description { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 2.5rem; line-height: 1.6; }
        .search-container { margin-bottom: 2rem; position: relative; max-width: 500px; }
        .search-container input { width: 100%; padding: 1.2rem 1.5rem; border-radius: 50px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; outline: none; font-size: 1rem; backdrop-filter: blur(10px); }
        .search-container button { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: var(--accent-gradient); border: none; padding: 0.6rem 1.5rem; border-radius: 50px; color: white; font-weight: 600; cursor: pointer; }
        .cta-group { display: flex; gap: 1.5rem; }
        .btn { padding: 1rem 2.5rem; border-radius: 50px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; border: none; }
        .btn-primary { background: var(--accent-gradient); color: white; box-shadow: 0 10px 20px rgba(157,80,187,0.3); }
        .btn-secondary { background: var(--glass); color: white; border: 1px solid var(--glass-border); }
        .pick-chip { border: 1px solid var(--glass-border); background: rgba(255,255,255,0.04); color: var(--text-primary); border-radius: 999px; padding: 9px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
        .hero-backdrop { position: absolute; top: 0; right: 0; width: 65%; height: 100%; z-index: 0; mask-image: linear-gradient(to left, black 60%, transparent); -webkit-mask-image: linear-gradient(to left, black 60%, transparent); }
        .hero-backdrop img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; filter: grayscale(20%); }
        .section { padding: 4rem; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .section-title { font-size: 1.8rem; font-weight: 700; }
        .movie-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
        .movie-card { position: relative; border-radius: 12px; overflow: hidden; background: var(--graphite); transition: all 0.4s; cursor: pointer; border: 1px solid var(--glass-border); }
        .movie-card:hover { transform: scale(1.05) translateY(-10px); z-index: 10; border-color: var(--cyan); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .video-container { position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; background: black; }
        .video-container.active { opacity: 1; pointer-events: auto; }
        .video-container iframe { width: 100%; height: 100%; border: none; }
        .card-info { position: absolute; bottom: 0; left: 0; width: 100%; padding: 1.5rem; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); opacity: 0; transform: translateY(20px); transition: all 0.3s; }
        .movie-card:hover .card-info { opacity: 1; transform: translateY(0); }
        .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem; }
        .card-meta { font-size: 0.75rem; color: var(--text-secondary); display: flex; gap: 1rem; }
        .modal { position: fixed; inset: 0; z-index: 220; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); }
        .modal-card { border-radius: 16px; overflow: hidden; background: rgba(26, 26, 26, 0.95); border: 1px solid rgba(255,255,255,0.1); }
        .modal-close { position: absolute; top: 20px; right: 20px; width: 42px; height: 42px; border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; background: rgba(255,255,255,0.04); color: white; cursor: pointer; }
        footer { padding: 4rem; border-top: 1px solid var(--glass-border); text-align: center; color: var(--text-secondary); font-size: 0.9rem; }
        @media (max-width: 1024px) { nav { padding: 1.5rem 2rem; } .hero { padding: 0 2rem; } .section { padding: 4rem 2rem; } .hero-title { font-size: 3.5rem; } }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <div id="health-banner" class="health-banner" aria-live="polite"></div>

    <div id="player-modal" class="modal" role="dialog" aria-hidden="true">
        <div class="modal-card" style="width: min(1100px, 96%);">
            <button class="modal-close" id="player-close" aria-label="Close player">✕</button>
            <div style="position: relative; padding-top: 56.25%;"><iframe id="player-iframe" src="" frameborder="0" allow="autoplay; encrypted-media; fullscreen" style="position: absolute; inset: 0; width: 100%; height: 100%;"></iframe></div>
        </div>
    </div>

    <nav>
        <div class="logo">LUMINA</div>
        <ul class="nav-links">
            <li><a class="nav-link is-active" href="#hero">Movies</a></li>
            <li><a class="nav-link" href="#results-section">Recommended</a></li>
            <li><a class="nav-link" href="#trending">Trending</a></li>
            <li id="kb-hint" style="font-size: 0.7rem; color: var(--text-secondary); cursor: help; border: 1px solid var(--glass-border); padding: 2px 8px; border-radius: 4px;">CMD + K</li>
            <li style="position: relative;">
                <button id="settings-btn" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2rem;">⚙️</button>
                <div id="settings-menu" style="display: none; position: absolute; top: 100%; right: 0; background: var(--graphite); border: 1px solid var(--glass-border); padding: 1rem; border-radius: 10px; width: 200px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                    <label style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; cursor: pointer;"><input type="checkbox" id="preview-toggle" checked> Video Previews</label>
                </div>
            </li>
        </ul>
    </nav>

    <div id="kb-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(20px);">
        <div style="background: var(--graphite); padding: 3rem; border-radius: 20px; border: 1px solid var(--glass-border); max-width: 400px; width: 90%;">
            <h2 style="margin-bottom: 2rem;">Shortcuts</h2>
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;"><span>Search</span> <kbd style="background: #333; padding: 2px 6px; border-radius: 4px;">/</kbd></div>
            <button id="close-kb" style="width: 100%; margin-top: 2rem; padding: 1rem; border-radius: 10px; background: var(--accent-gradient); border: none; color: white; cursor: pointer;">Got it</button>
        </div>
    </div>

    <header class="hero" id="hero">
        <div class="hero-backdrop" id="hero-backdrop"><img src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=2070&auto=format&fit=crop" alt="Hero Backdrop"></div>
        <div class="hero-content">
            <p class="hero-eyebrow">Now Streaming</p>
            <h1 class="hero-title" id="hero-title">Discover Your Next Favorite Film</h1>
            <p class="hero-description" id="hero-desc">Powered by AI and live TMDB discovery. Enter a movie you love to get instant recommendations.</p>
            <div class="search-container"><input type="text" id="movie-input" placeholder="Type a movie title..."><button id="search-btn">Find</button></div>
            <div class="cta-group">
                <button class="btn btn-primary" id="hero-primary">▶ Watch Trailer</button>
                <button class="btn btn-secondary" id="hero-secondary">ⓘ Details</button>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px;">
                <button class="pick-chip" data-title="Inception">Inception</button>
                <button class="pick-chip" data-title="Interstellar">Interstellar</button>
                <button class="pick-chip" data-title="Avatar">Avatar</button>
                <button class="pick-chip" data-title="The Dark Knight">The Dark Knight</button>
            </div>
        </div>
    </header>

    <section class="section" id="results-section" style="display: none;">
        <div class="section-header"><h2 class="section-title">Recommended For You</h2><span id="search-path"></span></div>
        <div class="movie-row" id="results-grid"></div>
    </section>

    <section class="section" id="trending">
        <div class="section-header"><h2 class="section-title">Trending Now</h2></div>
        <div class="movie-row" id="trending-grid"></div>
    </section>

    <footer><p>&copy; 2026 LUMINA. Built with FastAPI & ML</p></footer>
    <script src="lumina_app.js"></script>
</body>
</html>
