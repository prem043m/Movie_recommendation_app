services:
  - type: web
    name: movie-recommender-api
    env: python
    rootDir: .
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.recommend:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TMDB_API_KEY
        sync: false          # Set this manually in the Render dashboard
      - key: WEB_CONCURRENCY
        value: 1             # Force 1 worker to save RAM
      - key: ALLOW_UNSAFE_PICKLE
        value: 1             # Allow loading precomputed models for efficiency
